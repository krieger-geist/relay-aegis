spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/relay_aegis}
    username: ${DATABASE_USERNAME:relay}
    password: ${DATABASE_PASSWORD:relay_dev_only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
