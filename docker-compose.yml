services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay_aegis
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-relay_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - relay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-target:
    build: ./test-target
    container_name: relay-aegis-test-target
    expose:
      - "3000"
    ports:
      - "127.0.0.1:8091:3000"
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # Least-privilege Docker access. Each proxy holds the socket read-only, answers only the "backend" service, and
  # admits only the API calls listed (Go regexps, anchored at both ends). Everything else gets 403.
  # Recovery and inspection: read container state, logs, stats and networks; start or restart a container; attach a
  # container to a network. No create, exec, delete, image or volume calls.
  docker-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "0:0"
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=backend
      - -allowhealthcheck
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowGET=((/v1\.[0-9]+)?/(_ping|version|info|containers/json|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(json|logs|stats)|networks/[A-Za-z0-9][A-Za-z0-9_.-]*))
      - -allowPOST=(/v1\.[0-9]+/(containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(start|restart)|networks/[A-Za-z0-9][A-Za-z0-9_.-]*/connect))
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Patch-validation sandbox only: create, copy files into and out of, start, wait for and remove containers named
  # relay-sandbox-<12 hex>, and pull the configured build images. Host bind mounts are refused. Unused while RELAY_SANDBOX_ENABLED is false.
  sandbox-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "0:0"
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=backend
      - -allowhealthcheck
      - -allowbindmountfrom=/relay-sandbox-no-bind-mounts
      - -allowHEAD=((/v1\.[0-9]+)?/(_ping|containers/relay-sandbox-[0-9a-f]{12}/archive))
      - -allowGET=((/v1\.[0-9]+)?/(_ping|version|info|containers/relay-sandbox-[0-9a-f]{12}/(json|archive)|images/[A-Za-z0-9._/:@-]+/json))
      - -allowPUT=(/v1\.[0-9]+/containers/relay-sandbox-[0-9a-f]{12}/archive)
      - -allowPOST=(/v1\.[0-9]+/(containers/create|containers/relay-sandbox-[0-9a-f]{12}/(start|wait)|images/create))
      - -allowDELETE=(/v1\.[0-9]+/containers/relay-sandbox-[0-9a-f]{12})
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Docker rollback only (bad deploy -> last good image): read a container and an image, tag the last good image so
  # Docker keeps it (relay-rollback/<container>:last-good), create the replacement,
  # stop, rename and start containers, and reattach networks. Off by default: start it with `--profile rollback` and
  # set RELAY_DOCKER_ROLLBACK_ENABLED=true. Host bind mounts are refused unless RELAY_ROLLBACK_BIND_MOUNTS_FROM lists
  # the allowed host directories. The backend still only touches containers in RELAY_DOCKER_ALLOWED_CONTAINERS.
  rollback-proxy:
    image: wollomatic/socket-proxy:1.13.1
    profiles: [rollback]
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "0:0"
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=backend
      - -allowhealthcheck
      - -allowbindmountfrom=${RELAY_ROLLBACK_BIND_MOUNTS_FROM:-/relay-rollback-no-bind-mounts}
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowGET=((/v1\.[0-9]+)?/(_ping|version|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json|images/sha256:[0-9a-f]{64}/json))
      - -allowPOST=(/v1\.[0-9]+/(containers/create|containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(stop|start|rename)|networks/[A-Za-z0-9][A-Za-z0-9_.-]*/connect|images/sha256:[0-9a-f]{64}/tag))
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Add ",json-logs" for one JSON (ECS) object per log line, for Loki, Elasticsearch or Datadog.
      SPRING_PROFILES_ACTIVE: "${RELAY_SPRING_PROFILES:-postgres}"
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://db:5432/relay_aegis
      DATABASE_USERNAME: relay
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-relay_dev_only}
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      RELAY_RECOVERY_DOCKER_ENABLED: "true"
      # RELAY never sees the Docker socket: recovery and sandbox each reach Docker through their own allowlisting proxy.
      RELAY_DOCKER_HOST: tcp://docker-proxy:2375
      RELAY_SANDBOX_DOCKER_HOST: tcp://sandbox-proxy:2375
      # Bad-deploy rollback through rollback-proxy (start it with --profile rollback). Off unless set to true.
      RELAY_DOCKER_ROLLBACK_ENABLED: "${RELAY_DOCKER_ROLLBACK_ENABLED:-false}"
      RELAY_DOCKER_ROLLBACK_API_URL: http://rollback-proxy:2375
      RELAY_DEPLOYS_GOOD_AFTER_CHECKS: "${RELAY_DEPLOYS_GOOD_AFTER_CHECKS:-3}"
      RELAY_SLO_AVAILABILITY_TARGET: "${RELAY_SLO_AVAILABILITY_TARGET:-0.995}"
      RELAY_SLO_ALERTS_ENABLED: "${RELAY_SLO_ALERTS_ENABLED:-true}"
      # YAML runbooks from ./runbooks (new failure types without code changes), re-read every minute.
      RELAY_RUNBOOKS_DIR: /app/runbooks
      # Alerts from Alertmanager, Sentry and webhooks (POST /api/signals/...). Blank: those endpoints are off.
      RELAY_SIGNALS_TOKEN: ${RELAY_SIGNALS_TOKEN:-}
      RELAY_SENTRY_CLIENT_SECRET: ${RELAY_SENTRY_CLIENT_SECRET:-}
      RELAY_SENTRY_PROJECTS: "${RELAY_SENTRY_PROJECTS:-}"
      # Slack messages and Approve/Reject buttons, and a generic notification webhook.
      RELAY_SLACK_WEBHOOK_URL: ${RELAY_SLACK_WEBHOOK_URL:-}
      RELAY_SLACK_SIGNING_SECRET: ${RELAY_SLACK_SIGNING_SECRET:-}
      RELAY_SLACK_APPROVERS: "${RELAY_SLACK_APPROVERS:-}"
      RELAY_NOTIFY_WEBHOOK_URL: ${RELAY_NOTIFY_WEBHOOK_URL:-}
      RELAY_NOTIFY_WEBHOOK_SECRET: ${RELAY_NOTIFY_WEBHOOK_SECRET:-}
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:-http://localhost:5173}"
      RELAY_DOCKER_ALLOWED_CONTAINERS: "${RELAY_DOCKER_ALLOWED_CONTAINERS:-relay-aegis-test-target}"
      RELAY_DOCKER_INSPECT_CONTAINERS: "${RELAY_DOCKER_INSPECT_CONTAINERS:-}"
      RELAY_DOCKER_DEPENDENCIES: "${RELAY_DOCKER_DEPENDENCIES:-}"
      RELAY_RECOVERY_MAX_ATTEMPTS: "${RELAY_RECOVERY_MAX_ATTEMPTS:-2}"
      RELAY_RECOVERY_COOLDOWN_SECONDS: "${RELAY_RECOVERY_COOLDOWN_SECONDS:-60}"
      RELAY_SANDBOX_ENABLED: "${RELAY_SANDBOX_ENABLED:-false}"
      RELAY_SANDBOX_NETWORK: "${RELAY_SANDBOX_NETWORK:-none}"
      RELAY_MONITORING_ALLOWED_HOSTS: "${RELAY_MONITORING_ALLOWED_HOSTS:-test-target,localhost,127.0.0.1,host.docker.internal}"
      RELAY_ASSESSMENT_ALLOWED_HOSTS: "${RELAY_ASSESSMENT_ALLOWED_HOSTS:-localhost,127.0.0.1,test-target}"
      RELAY_ASSESSMENT_ALLOW_PUBLIC_HOSTS: "${RELAY_ASSESSMENT_ALLOW_PUBLIC_HOSTS:-false}"
      RELAY_LIMIT_ASSESSMENTS_PER_HOUR: "${RELAY_LIMIT_ASSESSMENTS_PER_HOUR:-30}"
      RELAY_LIMIT_APPLICATIONS_PER_HOUR: "${RELAY_LIMIT_APPLICATIONS_PER_HOUR:-20}"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      RELAY_AI_TIMEOUT_MS: "${RELAY_AI_TIMEOUT_MS:-8000}"
      RELAY_AI_GENERATE_BUDGET_MS: "${RELAY_AI_GENERATE_BUDGET_MS:-18000}"
      RELAY_MONITORING_INTERVAL_MS: "${RELAY_MONITORING_INTERVAL_MS:-60000}"
      RELAY_RECOVERY_VERIFICATION_TIMEOUT_MS: "${RELAY_RECOVERY_VERIFICATION_TIMEOUT_MS:-30000}"
      RELAY_MONITORING_TIMEOUT_MS: "${RELAY_MONITORING_TIMEOUT_MS:-2500}"
      RELAY_MONITORING_FAILURE_THRESHOLD: "${RELAY_MONITORING_FAILURE_THRESHOLD:-2}"
      RELAY_MONITORING_RECOVERY_THRESHOLD: "${RELAY_MONITORING_RECOVERY_THRESHOLD:-2}"
      # Browser origins allowed to call the API and sign in. scripts/live-demo.ps1 adds its tunnel URL here.
      RELAY_CORS_ALLOWED_ORIGINS: "${RELAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      # Access-token signing secret (>= 32 bytes). Blank = random per-process key: sessions then survive restarts only via refresh.
      RELAY_AUTH_JWT_SECRET: ${RELAY_AUTH_JWT_SECRET:-}
      RELAY_AUTH_ACCESS_TOKEN_TTL: "${RELAY_AUTH_ACCESS_TOKEN_TTL:-15m}"
      RELAY_AUTH_REFRESH_TOKEN_TTL: "${RELAY_AUTH_REFRESH_TOKEN_TTL:-7d}"
      RELAY_AUTH_COOKIE_SECURE: "${RELAY_AUTH_COOKIE_SECURE:-auto}"
      RELAY_AUTH_ADMIN_EMAILS: "${RELAY_AUTH_ADMIN_EMAILS:-}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RELAY_GITHUB_TOKEN: ${RELAY_GITHUB_TOKEN:-}
      RELAY_GITHUB_REMEDIATION_REPOSITORIES: "${RELAY_GITHUB_REMEDIATION_REPOSITORIES:-}"
      RELAY_GITHUB_REMEDIATION_APPROVERS: "${RELAY_GITHUB_REMEDIATION_APPROVERS:-}"
    volumes:
      - ./runbooks:/app/runbooks:ro
    depends_on:
      db:
        condition: service_healthy
      test-target:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
      sandbox-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 25s

  # Second backend instance for high availability: `docker compose --profile ha up -d`. Both share the database and
  # elect one leader, which monitors and runs recovery; the other serves the API and forwards recovery requests to it.
  # It answers to the same "backend" name, so the frontend and both Docker proxies treat the two alike.
  # Needs RELAY_AUTH_JWT_SECRET set, so an access token issued by one instance is accepted by the other.
  backend-2:
    extends:
      service: backend
    profiles: ["ha"]
    ports: !reset []
    networks:
      default:
        aliases: [backend]

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # Optional: docker compose --profile monitoring up -d
  # Prometheus scrapes RELAY's own metrics; Grafana opens with the RELAY AEGIS dashboard (http://localhost:3300).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - relay-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-relay_dev_only}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay-aegis.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - relay-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus

volumes:
  relay-postgres-data:
  relay-prometheus-data:
  relay-grafana-data:
