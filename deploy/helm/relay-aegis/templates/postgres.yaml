{{- if .Values.postgres.enabled }}
{{- if .Values.postgres.persistence }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "relay.labels" . | nindent 4 }}
  annotations:
    # Uninstalling RELAY must never delete its database.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.postgres.size }} } }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "relay.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_DB, value: relay_aegis }
            - { name: POSTGRES_USER, value: relay }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-secrets, key: password } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, relay, -d, relay_aegis] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          {{- if .Values.postgres.persistence }}
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-postgres }
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "relay.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ port: 5432, targetPort: postgres, name: postgres }]
{{- end }}
