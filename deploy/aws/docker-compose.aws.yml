# One small EC2 server (t3.small, 2 GB) running the released images behind Caddy, which gets a free HTTPS certificate.
# Used on top of the main file, from the repository root:
#
#   docker compose -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml up -d --no-build
#
# deploy/aws/setup.sh writes the .env this reads (domain, secrets) and runs that command. See docs/AWS.md.
services:
  db:
    restart: unless-stopped
    mem_limit: 256m

  test-target:
    # The demo application RELAY watches and heals. RELAY restarts it, so Docker must not.
    mem_limit: 128m

  docker-proxy:
    restart: unless-stopped

  sandbox-proxy:
    restart: unless-stopped

  backend:
    image: ghcr.io/krieger-geist/relay-aegis-backend:${RELAY_VERSION:-1.4.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 900m
    environment:
      # An explicit heap: the image's 75% default would size the heap from the whole server, not this container.
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=192m"
      # The browser reaches RELAY only over HTTPS through Caddy. nginx in the frontend image forwards "http" as the
      # scheme, so "auto" would leave the refresh cookie without Secure.
      RELAY_AUTH_COOKIE_SECURE: "true"
      RELAY_PUBLIC_URL: "https://${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}"
      RELAY_CORS_ALLOWED_ORIGINS: "https://${RELAY_DOMAIN}"
      # Only the demo application. No localhost or host names: on a cloud server those could reach the host itself.
      RELAY_MONITORING_ALLOWED_HOSTS: "test-target"
      RELAY_ASSESSMENT_ALLOWED_HOSTS: "test-target"
      RELAY_ASSESSMENT_ALLOW_PUBLIC_HOSTS: "false"
      # Anyone can sign up here: keep each account's share small.
      RELAY_LIMIT_ASSESSMENTS_PER_HOUR: "10"
      RELAY_LIMIT_APPLICATIONS_PER_HOUR: "3"
      RELAY_DOCKER_ALLOWED_CONTAINERS: "relay-aegis-test-target"

  frontend:
    image: ghcr.io/krieger-geist/relay-aegis-frontend:${RELAY_VERSION:-1.4.0}
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 64m

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - relay-caddy-data:/data
      - relay-caddy-config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  relay-caddy-data:
  relay-caddy-config:
