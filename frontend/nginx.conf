server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # Re-resolve "backend" through Docker's embedded DNS. A literal hostname in proxy_pass is resolved only once
  # at startup, so recreating the backend container (new IP) would otherwise leave every /api call failing with 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8080;

  location /api/ {
    # With a variable and no URI part, nginx forwards the original request URI unchanged.
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location /actuator/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
